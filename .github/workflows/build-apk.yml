name: Build APK

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Installer les dépendances
        run: npm install --legacy-peer-deps

      - name: Définir le nom du paquet Android
        run: |
          jq '.expo.android.package = "com.mahmoh.calculatrice"' app.json > app.tmp.json
          mv app.tmp.json app.json

      - name: Générer le projet Android (Expo prebuild)
        run: npx expo prebuild --platform android --no-install

      - name: Compiler l'APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --stacktrace

      - name: Rassembler l'APK
        run: |
          mkdir -p out
          cp android/app/build/outputs/apk/release/*.apk out/calculatrice.apk
          ls -l out

      - uses: actions/upload-artifact@v4
        with:
          name: apk
          path: out/calculatrice.apk

      - name: Publier dans Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-${{ github.run_number }}
          name: APK ${{ github.run_number }}
          files: out/calculatrice.apk
