name: Build APK

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Compiler l'APK (debug)
        run: |
          set -e
          # Cherche la racine du projet Android (settings.gradle ou settings.gradle.kts)
          SETTINGS=$(find . -maxdepth 3 \( -name settings.gradle -o -name settings.gradle.kts \) | head -n 1)
          if [ -z "$SETTINGS" ]; then
            echo "Aucun projet Android (settings.gradle) trouvé dans ce dépôt."
            exit 1
          fi
          cd "$(dirname "$SETTINGS")"
          if [ -f gradlew ]; then
            chmod +x gradlew
            ./gradlew assembleDebug --stacktrace
          else
            gradle assembleDebug --stacktrace
          fi

      - name: Rassembler l'APK
        run: |
          mkdir -p out
          find . -path ./out -prune -o -name "*.apk" -path "*outputs*" -print -exec cp {} out/ \;
          ls -l out

      - uses: actions/upload-artifact@v4
        with:
          name: apk
          path: out/*.apk

      - name: Publier dans Releases (téléchargement direct)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-${{ github.run_number }}
          name: APK ${{ github.run_number }}
          files: out/*.apk
