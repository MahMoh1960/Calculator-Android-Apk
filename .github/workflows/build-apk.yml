name: Build APK

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

env:
  APP_NAME: "Calculatrice"
  APP_ID: "com.mahmoh.calculatrice"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Préparer la page web
        run: |
          set -e
          INDEX=$(find . -maxdepth 3 -name index.html \
            -not -path "./node_modules/*" -not -path "./.git/*" -not -path "./.github/*" \
            | head -n 1)
          if [ -z "$INDEX" ]; then
            echo "Aucun index.html trouvé dans ce dépôt."
            exit 1
          fi
          WEBDIR=$(dirname "$INDEX")
          echo "Page web trouvée dans : $WEBDIR"
          mkdir -p "$RUNNER_TEMP/app/www"
          rsync -a --exclude ".git" --exclude ".github" --exclude "node_modules" \
            "$WEBDIR"/ "$RUNNER_TEMP/app/www/"
          ls -l "$RUNNER_TEMP/app/www"

      - name: Créer le projet Android (Capacitor)
        working-directory: ${{ runner.temp }}/app
        run: |
          set -e
          npm init -y
          npm install @capacitor/core@6 @capacitor/cli@6 @capacitor/android@6
          npx cap init "$APP_NAME" "$APP_ID" --web-dir www
          npx cap add android
          npx cap sync android

      - name: Compiler l'APK (debug)
        working-directory: ${{ runner.temp }}/app/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace

      - name: Rassembler l'APK
        run: |
          mkdir -p out
          cp "$RUNNER_TEMP/app/android/app/build/outputs/apk/debug/app-debug.apk" out/calculatrice.apk
          ls -l out

      - uses: actions/upload-artifact@v4
        with:
          name: apk
          path: out/calculatrice.apk

      - name: Publier dans Releases (téléchargement direct)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-${{ github.run_number }}
          name: APK ${{ github.run_number }}
          files: out/calculatrice.apk
